name: ecole_elearning
description: Gestion d'Écoles & E-Learning - application mobile Flutter (Étudiant, Enseignant, Administrateur).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  video_player: ^2.9.2
  http: ^1.2.2
  google_fonts: ^9.0.0
  file_picker: ^13.3.0
  path_provider: ^2.1.2
  share_plus: ^13.3.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_pdfview: ^1.4.0
  path: ^1.9.0
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
